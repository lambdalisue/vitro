[package]
name = "vitro"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
description = "Disposable development VMs driven from a CLI"
license = "MIT"
publish = false

[workspace]
# The spikes are throwaway crates that settle one design question each. They
# carry their own lockfiles and must not be dragged into this build.
exclude = ["spikes/seedfat", "spikes/portprobe", "spikes/hostfacts"]

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
fatfs = "0.3.6"
fs4 = { version = "0.9", features = ["sync"] }
fscommon = "0.1.1"
humantime-serde = "1"
png = "0.18"
rand = "0.10.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11.0"
sysinfo = "0.32"
tempfile = "3"
time = { version = "0.3", features = ["serde-well-known", "formatting", "parsing", "macros"] }
toml = "0.8"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
ureq = "3.4.2"
which = "8.0.6"
