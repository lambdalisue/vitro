name: CI

on:
  push:
    branches: [main]
  pull_request:

# A pull request only needs its latest commit checked. A run on main waits
# for the one before it instead of cancelling it, so each one finishes and
# saves the caches that pull requests start from.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  # Linux matters most: it is the host vitro is least often developed on, and
  # the one where a portability mistake would otherwise go unnoticed until
  # somebody tried it.
  #
  # On Windows, everything that touches a Unix socket, a file mode or a signal
  # is behind `cfg(unix)` with a Windows counterpart, and this is the only
  # place those branches compile. The fake-binary scaffolding the integration
  # tests use is Unix-only, so those tests skip themselves there; what Windows
  # proves is that the crate builds, lints and passes its unit tests, not that
  # a VM runs.
  ci:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: cachix/install-nix-action@v31
        if: runner.os != 'Windows'
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
      # The store the development shell comes from. Only an exact match is
      # restored, and only main saves, so pull requests cannot evict the
      # caches each other start from.
      - uses: nix-community/cache-nix-action@v7
        if: runner.os != 'Windows'
        with:
          primary-key: nix-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('flake.nix', 'flake.lock', 'rust-toolchain.toml') }}
          save: ${{ github.ref == 'refs/heads/main' }}
      # Load the development shell (flake.nix) into the job, so the steps
      # below run the same commands on every OS.
      - uses: nicknovitski/nix-develop@v1
        if: runner.os != 'Windows'
      # Nix does not run on Windows: rustup reads rust-toolchain.toml, and
      # just runs the recipes with the runner's Git Bash.
      - uses: taiki-e/install-action@v2
        if: runner.os == 'Windows'
        with:
          tool: just
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      # The same gate as local development (justfile).
      - run: just ci
        env:
          CI: "1"
