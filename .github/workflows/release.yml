name: Release

# Publishing a GitHub Release starts this: write the notes, publish, and the
# binaries, the Homebrew tap, the Nix cache and the crates.io release follow.
# The release exists before its assets do — expect a few minutes with the
# notes up and nothing attached.
#
# The tag is the only record of the version. `version` in Cargo.toml and
# Cargo.lock is a placeholder that each cargo job stamps from the tag before it
# builds, so `--locked` still holds the build to the versions the tests ran
# against. The flake stamps its build the same way, from VERSION, which GitHub
# fills in with the tag when it serves the tagged source.
on:
  release:
    types: [published]

permissions:
  contents: read

# The tag reaches every step through the environment rather than being
# interpolated into a script, so its text can never be read as shell.
env:
  TAG: ${{ github.event.release.tag_name }}

jobs:
  # CI having passed on main says nothing about the commit a release happens
  # to point at, and nothing is attached or published until its tests pass.
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - run: cargo test --locked

  build:
    name: build (${{ matrix.target }})
    strategy:
      fail-fast: false
      matrix:
        # Native runners for every target: vitro runs same-architecture guests
        # and nothing else, so an aarch64 build that was never run on aarch64
        # is exactly the kind of claim this project does not make.
        include:
          - { target: aarch64-apple-darwin, os: macos-15 }
          - { target: x86_64-apple-darwin, os: macos-15-intel }
          # 22.04 links against an older glibc, so the binary runs on more
          # distributions.
          - { target: x86_64-unknown-linux-gnu, os: ubuntu-22.04 }
          - { target: aarch64-unknown-linux-gnu, os: ubuntu-22.04-arm }
          - { target: x86_64-pc-windows-msvc, os: windows-latest }
          # `ring`, which arrives under ureq's TLS, needs clang here. The image
          # ships LLVM, so this needs no install step — but it is why this
          # target cannot simply be cross-compiled from the x86-64 runner.
          - { target: aarch64-pc-windows-msvc, os: windows-11-arm }
    runs-on: ${{ matrix.os }}
    # Release builds use rustup, not Nix, so a binary never refers into
    # /nix/store, and they start without caches, so nothing a pull request
    # wrote can reach a published binary.
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Stamp the version
        shell: bash
        run: |
          version="${TAG#v}"
          if ! [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "tag $TAG is not v<semver>" >&2
            exit 1
          fi
          VERSION="$version" perl -pi -e 's/^version = "0\.0\.0"/version = "$ENV{VERSION}"/' Cargo.toml
          VERSION="$version" perl -0pi -e 's/(name = "vitro"\nversion = )"0\.0\.0"/$1"$ENV{VERSION}"/' Cargo.lock
      - name: Add the target
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
        run: rustup target add "$TARGET"
      - name: Build
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
        run: cargo build --release --locked --target "$TARGET"
      - name: Archive
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
        run: |
          mkdir dist
          name="vitro-${TAG}-${TARGET}"
          if [[ "$RUNNER_OS" == "Windows" ]]; then
            7z a "dist/${name}.zip" "./target/${TARGET}/release/vitro.exe" LICENSE README.md
          else
            tar -czf "dist/${name}.tar.gz" -C "target/${TARGET}/release" vitro -C "$GITHUB_WORKSPACE" LICENSE README.md
          fi
      - uses: actions/upload-artifact@v7
        with:
          name: dist-${{ matrix.target }}
          path: dist/*

  # One job owns the upload so the matrix builds cannot race, and so the
  # checksums are computed from exactly the bytes that get attached.
  attach:
    needs: [test, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true
      - name: Checksums
        working-directory: dist
        run: |
          for f in vitro-*; do
            sha256sum "$f" > "$f.sha256"
          done
      # `gh release upload` only adds assets, so the notes written by hand are
      # never touched. --clobber keeps a re-run from failing on an asset that
      # is already there.
      - name: Upload
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh release upload "$TAG" dist/* --clobber

  # Point the tap at the archives this release just attached, so the URLs in
  # the formula resolve the moment it lands. A pre-release is left out: `brew
  # upgrade` would otherwise move everyone onto it.
  homebrew:
    needs: attach
    if: ${{ !github.event.release.prerelease }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      # The checksums the attach job computed from the uploaded bytes, rather
      # than recomputed here from a second copy.
      - name: Download the checksums
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh release download "$TAG" --pattern '*.sha256' --dir dist
      # HOMEBREW_TAP_TOKEN is a token with contents:write on the tap;
      # GITHUB_TOKEN cannot push to another repository. persist-credentials
      # stays false because the verification below runs the release binary,
      # which must not find a credential that can rewrite the tap.
      - uses: actions/checkout@v7
        with:
          repository: lambdalisue/homebrew-vitro
          token: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          persist-credentials: false
          path: tap
      - name: Render the formula
        run: |
          mkdir -p tap/Formula
          perl packaging/homebrew/render.pl "${TAG#v}" dist \
            < packaging/homebrew/vitro.rb > tap/Formula/vitro.rb
          cat tap/Formula/vitro.rb
      # Installed before it is published: a URL typo, a checksum paired with
      # the wrong target or a binary that will not start would otherwise reach
      # users first. Only the Linux x86_64 archive is fetched; the others come
      # from the same template and the same checksum files. QEMU is skipped
      # because the formula's own code is what is under test, not QEMU's —
      # which is also why the binary is run directly: `brew test` refuses a
      # formula whose dependencies are not installed.
      - name: Verify the formula
        env:
          HOMEBREW_NO_AUTO_UPDATE: 1
          HOMEBREW_NO_ANALYTICS: 1
        run: |
          eval "$(/home/linuxbrew/.linuxbrew/bin/brew shellenv)"
          tap="$(brew --repository)/Library/Taps/lambdalisue/homebrew-vitro"
          mkdir -p "$(dirname "$tap")"
          ln -s "$PWD/tap" "$tap"
          brew install --ignore-dependencies lambdalisue/vitro/vitro
          "$(brew --prefix)/bin/vitro" --version | grep -Fx "vitro ${TAG#v}"
          test -s "$(brew --prefix)/share/fish/vendor_completions.d/vitro.fish"
      - name: Commit and push
        working-directory: tap
        env:
          TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Formula/vitro.rb
          if git diff --staged --quiet; then
            echo "formula already up to date"
            exit 0
          fi
          git commit -m "vitro ${TAG#v}"
          # The helper reads TAP_TOKEN when git runs it, so the token reaches
          # neither argv nor .git/config. The single quotes are what keep this
          # shell from expanding it first.
          # shellcheck disable=SC2016
          git -c credential.helper= \
              -c credential.helper='!f() { echo username=x-access-token; echo "password=$TAP_TOKEN"; }; f' \
              push origin HEAD:main

  # The flake as `nix profile install github:lambdalisue/vitro/vX.Y.Z` fetches
  # it: from the archive GitHub serves, whose VERSION holds the tag. Building
  # that, not the checkout, both proves the tag reaches `--version` and puts
  # the exact build such an install looks up into the Cachix cache.
  nix:
    needs: test
    uses: lambdalisue/nix-github-release/.github/workflows/build.yml@v0.1.0
    with:
      ref: ${{ github.event.release.tag_name }}
      cachix-cache: ${{ vars.CACHIX_CACHE }}
    secrets:
      cachix-auth-token: ${{ secrets.CACHIX_AUTH_TOKEN }}

  # Last, and only once every target has proved it builds: a published version
  # can be yanked but never replaced.
  #
  # Trusted publishing: crates.io trusts this workflow through OIDC, so no
  # token is stored.
  crates-io:
    needs: [test, build]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Stamp the version
        run: |
          VERSION="${TAG#v}" perl -pi -e 's/^version = "0\.0\.0"/version = "$ENV{VERSION}"/' Cargo.toml
          VERSION="${TAG#v}" perl -0pi -e 's/(name = "vitro"\nversion = )"0\.0\.0"/$1"$ENV{VERSION}"/' Cargo.lock
      # A re-run after a successful publish must not fail on the version
      # crates.io already has.
      - name: Check whether this version is published
        id: published
        run: |
          status=$(curl -s -o /dev/null -w '%{http_code}' \
            -A "vitro release workflow (https://github.com/${GITHUB_REPOSITORY})" \
            "https://crates.io/api/v1/crates/vitro/${TAG#v}")
          echo "skip=$([[ "$status" == 200 ]] && echo true || echo false)" >> "$GITHUB_OUTPUT"
      - uses: rust-lang/crates-io-auth-action@v1
        if: steps.published.outputs.skip != 'true'
        id: auth
      - if: steps.published.outputs.skip != 'true'
        run: cargo publish --locked --allow-dirty
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
