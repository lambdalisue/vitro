name: Release

# Publishing a GitHub Release starts this: write the notes, publish, and the
# binaries and the crates.io release follow. The release exists before its
# assets do — expect a few minutes with the notes up and nothing attached.
#
# The tag is the only record of the version. `version` in Cargo.toml and
# Cargo.lock is a placeholder that each job stamps from the tag before it
# builds, so `--locked` still holds the build to the versions the tests ran
# against.
on:
  release:
    types: [published]

permissions:
  contents: read

# The tag reaches every step through the environment rather than being
# interpolated into a script, so its text can never be read as shell.
env:
  TAG: ${{ github.event.release.tag_name }}

jobs:
  # CI having passed on main says nothing about the commit a release happens
  # to point at, and nothing is attached or published until its tests pass.
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - run: cargo test --locked

  build:
    name: build (${{ matrix.target }})
    strategy:
      fail-fast: false
      matrix:
        # Native runners for every target: vitro runs same-architecture guests
        # and nothing else, so an aarch64 build that was never run on aarch64
        # is exactly the kind of claim this project does not make.
        include:
          - { target: aarch64-apple-darwin, os: macos-15 }
          - { target: x86_64-apple-darwin, os: macos-15-intel }
          # 22.04 links against an older glibc, so the binary runs on more
          # distributions.
          - { target: x86_64-unknown-linux-gnu, os: ubuntu-22.04 }
          - { target: aarch64-unknown-linux-gnu, os: ubuntu-22.04-arm }
          - { target: x86_64-pc-windows-msvc, os: windows-latest }
          # `ring`, which arrives under ureq's TLS, needs clang here. The image
          # ships LLVM, so this needs no install step — but it is why this
          # target cannot simply be cross-compiled from the x86-64 runner.
          - { target: aarch64-pc-windows-msvc, os: windows-11-arm }
    runs-on: ${{ matrix.os }}
    # Release builds use rustup, not Nix, so a binary never refers into
    # /nix/store, and they start without caches, so nothing a pull request
    # wrote can reach a published binary.
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Stamp the version
        shell: bash
        run: |
          version="${TAG#v}"
          if ! [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "tag $TAG is not v<semver>" >&2
            exit 1
          fi
          VERSION="$version" perl -pi -e 's/^version = "0\.0\.0"/version = "$ENV{VERSION}"/' Cargo.toml
          VERSION="$version" perl -0pi -e 's/(name = "vitro"\nversion = )"0\.0\.0"/$1"$ENV{VERSION}"/' Cargo.lock
      - name: Add the target
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
        run: rustup target add "$TARGET"
      - name: Build
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
        run: cargo build --release --locked --target "$TARGET"
      - name: Archive
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
        run: |
          mkdir dist
          name="vitro-${TAG}-${TARGET}"
          if [[ "$RUNNER_OS" == "Windows" ]]; then
            7z a "dist/${name}.zip" "./target/${TARGET}/release/vitro.exe" LICENSE README.md
          else
            tar -czf "dist/${name}.tar.gz" -C "target/${TARGET}/release" vitro -C "$GITHUB_WORKSPACE" LICENSE README.md
          fi
      - uses: actions/upload-artifact@v7
        with:
          name: dist-${{ matrix.target }}
          path: dist/*

  # One job owns the upload so the matrix builds cannot race, and so the
  # checksums are computed from exactly the bytes that get attached.
  attach:
    needs: [test, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true
      - name: Checksums
        working-directory: dist
        run: |
          for f in vitro-*; do
            sha256sum "$f" > "$f.sha256"
          done
      # `gh release upload` only adds assets, so the notes written by hand are
      # never touched. --clobber keeps a re-run from failing on an asset that
      # is already there.
      - name: Upload
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh release upload "$TAG" dist/* --clobber

  # Last, and only once every target has proved it builds: a published version
  # can be yanked but never replaced.
  #
  # Trusted publishing: crates.io trusts this workflow through OIDC, so no
  # token is stored.
  crates-io:
    needs: [test, build]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Stamp the version
        run: |
          VERSION="${TAG#v}" perl -pi -e 's/^version = "0\.0\.0"/version = "$ENV{VERSION}"/' Cargo.toml
          VERSION="${TAG#v}" perl -0pi -e 's/(name = "vitro"\nversion = )"0\.0\.0"/$1"$ENV{VERSION}"/' Cargo.lock
      # A re-run after a successful publish must not fail on the version
      # crates.io already has.
      - name: Check whether this version is published
        id: published
        run: |
          status=$(curl -s -o /dev/null -w '%{http_code}' \
            -A "vitro release workflow (https://github.com/${GITHUB_REPOSITORY})" \
            "https://crates.io/api/v1/crates/vitro/${TAG#v}")
          echo "skip=$([[ "$status" == 200 ]] && echo true || echo false)" >> "$GITHUB_OUTPUT"
      - uses: rust-lang/crates-io-auth-action@v1
        if: steps.published.outputs.skip != 'true'
        id: auth
      - if: steps.published.outputs.skip != 'true'
        run: cargo publish --locked --allow-dirty
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
